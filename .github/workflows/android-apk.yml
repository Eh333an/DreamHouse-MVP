name: DreamHouse Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Unity project archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="DreamHouse_CloudBuild_Prep.zip"
          test -f "$ARCHIVE" || { echo "Missing $ARCHIVE"; exit 1; }
          mkdir -p "$RUNNER_TEMP/dreamhouse-project"
          unzip -q "$ARCHIVE" -d "$RUNNER_TEMP/dreamhouse-project"
          test -d "$RUNNER_TEMP/dreamhouse-project/DreamHouse/Assets"
          test -f "$RUNNER_TEMP/dreamhouse-project/DreamHouse/ProjectSettings/ProjectVersion.txt"
          echo "UNITY_PROJECT_PATH=$RUNNER_TEMP/dreamhouse-project/DreamHouse" >> "$GITHUB_ENV"

      - name: Build APK with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.UNITY_PROJECT_PATH }}
          targetPlatform: Android
          androidAppBundle: false
          allowDirtyBuild: true

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DreamHouse-Android-APK
          path: build/Android/**/*.apk
          if-no-files-found: error
          retention-days: 14
