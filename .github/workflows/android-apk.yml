name: DreamHouse Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Unity project archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="DreamHouse_CloudBuild_Prep.zip"
          test -f "$ARCHIVE" || { echo "Missing $ARCHIVE"; exit 1; }
          PROJECT_ROOT="$GITHUB_WORKSPACE/.build/dreamhouse-project"
          mkdir -p "$PROJECT_ROOT"
          unzip -q "$ARCHIVE" -d "$PROJECT_ROOT"
          test -d "$PROJECT_ROOT/DreamHouse/Assets"
          test -f "$PROJECT_ROOT/DreamHouse/ProjectSettings/ProjectVersion.txt"
          echo "UNITY_PROJECT_PATH=$PROJECT_ROOT/DreamHouse" >> "$GITHUB_ENV"

      - name: Build APK with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: ${{ env.UNITY_PROJECT_PATH }}
          unityVersion: 2022.3.20f1
          targetPlatform: Android
          allowDirtyBuild: true

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DreamHouse-Android-APK
          path: |
            .build/dreamhouse-project/DreamHouse/build/Android/**/*.apk
            build/Android/**/*.apk
          if-no-files-found: error
          retention-days: 14
